[project]
name = "pleiades"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "a2wsgi>=1.10.10",
    "anyio>=4.15.1",
    "cryptography>=46.0.3",
    "flask>=3.1.3",
    "pycrdt>=0.14.8",
    "starlette>=1.7.0",
    "tomlkit>=0.15.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["server/tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["frontend", "artifacts", "context"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "S"]
# Any is the honest type at the tomlkit boundary in config.py.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts; fixtures and throwaway test passwords needn't be annotated.
"server/tests/**" = ["S101", "S105", "S106", "ANN"]
