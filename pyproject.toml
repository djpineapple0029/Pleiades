[project]
name = "atlasmap"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.3",
    "flask>=3.1.3",
    "pyrefly>=0.60.0",
    "tomlkit>=0.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["server/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
