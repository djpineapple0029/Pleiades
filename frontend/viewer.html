<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__ATLASMAP_TITLE__</title>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <!-- CRT scanlines over the scene, shown only in the Terminal look. -->
    <div id="look-scan"></div>
    <!-- Dips the scene to black while the look changes (looks.js). -->
    <div id="look-fade"></div>

    <div id="crosshair" hidden></div>
    <p id="hud"></p>
    <p id="speed"></p>

    <div id="overlay">
      <p class="prompt">Click to fly</p>
      <!-- Filled from the keymap (keysHelp.js). -->
      <ul class="keys"></ul>
      <p id="notice" hidden></p>
    </div>

    <script id="atlasmap-settings" type="application/json">
      __ATLASMAP_SETTINGS__
    </script>
    <script id="atlasmap-map" type="application/json">
      __ATLASMAP_PAYLOAD__
    </script>
    <script type="module" src="/src/viewer.js"></script>
  </body>
</html>
