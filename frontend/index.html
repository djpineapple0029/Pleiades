<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AtlasMap</title>
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <div id="crosshair" hidden></div>
    <p id="hud"></p>
    <p id="speed"></p>

    <div id="radial-menu" hidden></div>
    <div id="editor" hidden></div>
    <aside id="notes-sidebar" hidden></aside>
    <div id="search" hidden></div>
    <p id="resume-pill" hidden></p>

    <div id="overlay">
      <p class="prompt">Click to fly</p>
      <!-- Filled from the server's keymap at startup (keysHelp.js). -->
      <ul class="keys"></ul>
      <p id="notice" hidden></p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
